server:
  listen: "127.0.0.1:8407"

auth:
  secureCookies: false

secrets:
  jwtSecret: "__AIHUB_GROK_JWT_SECRET__"
  credentialEncryptionKey: "__AIHUB_GROK_CREDENTIAL_KEY__"

bootstrapAdmin:
  username: "admin"
  password: "__AIHUB_GROK_ADMIN_PASSWORD__"

frontend:
  publicApiBaseURL: "http://127.0.0.1:8407"
  staticPath: "./frontend/dist"

database:
  driver: sqlite
  sqlite:
    path: "./data/backend.db"

runtimeStore:
  driver: memory

media:
  driver: local
  local:
    path: "./data/media"
