name: Build Android ARM64 bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "config.example.json"
      - "configs/**"
      - "scripts/**"
      - ".github/workflows/build-android-bundle.yml"

permissions:
  contents: write

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: aarch64-linux-android

      - name: Locate Android NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            ndk="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          test -d "$ndk"
          toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$toolchain/aarch64-linux-android24-clang"
          echo "ANDROID_NDK_SELECTED=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Build hubd for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/AhB/bin
          CGO_ENABLED=0 GOOS=android GOARCH=arm64             go build -trimpath -ldflags="-s -w" -o dist/AhB/bin/hubd ./cmd/hubd

      - name: Install pinned OpenCode ARM64 gateway
        shell: bash
        run: |
          set -euo pipefail
          ver=v1.3.7
          pkg="opencode2api_${ver}_linux_arm64"
          curl -fL --retry 3 -o "/tmp/${pkg}.tar.gz"             "https://github.com/jasonxu114514/opencode2api/releases/download/${ver}/${pkg}.tar.gz"
          curl -fL --retry 3 -o "/tmp/${pkg}.tar.gz.sha256"             "https://github.com/jasonxu114514/opencode2api/releases/download/${ver}/${pkg}.tar.gz.sha256"
          cd /tmp
          sha256sum -c "${pkg}.tar.gz.sha256"
          tar -xzf "${pkg}.tar.gz"
          cp "${pkg}/opencode2api" "$GITHUB_WORKSPACE/dist/AhB/bin/opencode2api"

      - name: Build pinned FreeBuff gateway for Android ARM64
        shell: bash
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_TOOLCHAIN }}/aarch64-linux-android24-clang
          CC_aarch64_linux_android: ${{ env.ANDROID_TOOLCHAIN }}/aarch64-linux-android24-clang
          AR_aarch64_linux_android: ${{ env.ANDROID_TOOLCHAIN }}/llvm-ar
          RANLIB_aarch64_linux_android: ${{ env.ANDROID_TOOLCHAIN }}/llvm-ranlib
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.10.3 https://github.com/lza6/Freebuff-2API.git /tmp/freebuff2api
          cd /tmp/freebuff2api
          cargo build --locked --release --target aarch64-linux-android
          cp target/aarch64-linux-android/release/freebuff2api "$GITHUB_WORKSPACE/dist/AhB/bin/freebuff2api"

      - name: Try Agent2API headless for Android ARM64
        id: agent2api
        continue-on-error: true
        shell: bash
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_TOOLCHAIN }}/aarch64-linux-android24-clang
          CC_aarch64_linux_android: ${{ env.ANDROID_TOOLCHAIN }}/aarch64-linux-android24-clang
          AR_aarch64_linux_android: ${{ env.ANDROID_TOOLCHAIN }}/llvm-ar
          RANLIB_aarch64_linux_android: ${{ env.ANDROID_TOOLCHAIN }}/llvm-ranlib
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.9.5 https://github.com/aimod-cc/agent2api.git /tmp/agent2api
          cd /tmp/agent2api/desktop-tauri/src-tauri
          cargo build --locked --release --target aarch64-linux-android             --package agent2api-server --bin agent2api-server
          cp ../../target/aarch64-linux-android/release/agent2api-server             "$GITHUB_WORKSPACE/dist/AhB/bin/agent2api-server"
          mkdir -p "$GITHUB_WORKSPACE/dist/AhB/data/agent2api"
          cp -R ../ui "$GITHUB_WORKSPACE/dist/AhB/data/agent2api/ui"

      - name: Assemble Termux bundle
        shell: bash
        run: |
          set -euo pipefail
          cp config.example.json dist/AhB/
          cp -R configs dist/AhB/
          mkdir -p dist/AhB/scripts dist/AhB/data/opencode dist/AhB/data/freebuff dist/AhB/data/agent2api dist/AhB/logs
          cp scripts/prepare-configs.sh scripts/run-termux.sh scripts/start-termux.sh              scripts/stop-termux.sh scripts/doctor-termux.sh scripts/smoke.sh              scripts/test-chat.sh scripts/enable-agent2api.sh dist/AhB/scripts/
          cp configs/opencode2api.json dist/AhB/data/opencode/config.json
          cp configs/freebuff2api.json dist/AhB/data/freebuff/config.json
          chmod +x dist/AhB/bin/* dist/AhB/scripts/*.sh
          tar -C dist -czf AhB_android_arm64.tar.gz AhB
          sha256sum AhB_android_arm64.tar.gz > AhB_android_arm64.tar.gz.sha256
          sha256sum dist/AhB/bin/* > AhB_android_arm64_binaries.sha256
          if [ -x dist/AhB/bin/agent2api-server ]; then
            echo "Agent2API: included" > AhB_android_arm64_manifest.txt
          else
            echo "Agent2API: not included (build unsupported/failed); install from source later if desired" > AhB_android_arm64_manifest.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AhB-android-arm64
          retention-days: 14
          path: |
            AhB_android_arm64.tar.gz
            AhB_android_arm64.tar.gz.sha256
            AhB_android_arm64_binaries.sha256
            AhB_android_arm64_manifest.txt

      - name: Publish dev-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view dev-latest >/dev/null 2>&1; then
            gh release delete dev-latest --yes --cleanup-tag
          fi
          gh release create dev-latest             AhB_android_arm64.tar.gz             AhB_android_arm64.tar.gz.sha256             AhB_android_arm64_binaries.sha256             AhB_android_arm64_manifest.txt             --target "$GITHUB_SHA"             --title "AhB Android ARM64 dev-latest"             --notes "Automated Android/Termux ARM64 bundle. Core includes hubd, opencode2api and Freebuff2API. See manifest for Agent2API inclusion."             --prerelease
