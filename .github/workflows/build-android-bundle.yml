name: Build Android ARM64 bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "config.example.json"
      - "configs/**"
      - "scripts/**"
      - ".github/workflows/build-android-bundle.yml"

permissions:
  contents: write

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"

      - name: Prepare Rust and Android NDK
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android
          yes | sdkmanager "ndk;27.2.12479018" >/dev/null
          cargo install cargo-ndk --locked

      - name: Build hubd for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/AhB/bin
          CGO_ENABLED=0 GOOS=android GOARCH=arm64             go build -trimpath -ldflags="-s -w" -o dist/AhB/bin/hubd ./cmd/hubd

      - name: Build OpenCode gateway for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.3.7 https://github.com/jasonxu114514/opencode2api.git /tmp/opencode2api
          cd /tmp/opencode2api
          CGO_ENABLED=0 GOOS=android GOARCH=arm64             go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/dist/AhB/bin/opencode2api" ./cmd/opencode2api

      - name: Build FreeBuff gateway for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.10.3 https://github.com/lza6/Freebuff-2API.git /tmp/freebuff2api
          cd /tmp/freebuff2api
          CARGO_BUILD_JOBS=2 cargo ndk -t arm64-v8a -p 24 build --locked --release
          cp target/aarch64-linux-android/release/freebuff2api "$GITHUB_WORKSPACE/dist/AhB/bin/freebuff2api"
          cp LICENSE "$GITHUB_WORKSPACE/dist/AhB/LICENSE.freebuff2api" || true

      - name: Build Agent2API headless for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.9.5 https://github.com/aimod-cc/agent2api.git /tmp/agent2api
          cd /tmp/agent2api/desktop-tauri/src-tauri
          CARGO_BUILD_JOBS=2 cargo ndk -t arm64-v8a -p 24 build --locked --release             --package agent2api-server --bin agent2api-server
          cp ../../target/aarch64-linux-android/release/agent2api-server             "$GITHUB_WORKSPACE/dist/AhB/bin/agent2api-server"
          mkdir -p "$GITHUB_WORKSPACE/dist/AhB/data/agent2api"
          cp -R ../ui "$GITHUB_WORKSPACE/dist/AhB/data/agent2api/ui"

      - name: Assemble Termux bundle
        shell: bash
        run: |
          set -euo pipefail
          cp config.example.json dist/AhB/
          cp -R configs dist/AhB/
          mkdir -p dist/AhB/scripts dist/AhB/data/opencode dist/AhB/data/freebuff dist/AhB/logs
          cp scripts/prepare-configs.sh scripts/run-termux.sh scripts/start-termux.sh              scripts/stop-termux.sh scripts/doctor-termux.sh scripts/smoke.sh              scripts/test-chat.sh scripts/enable-agent2api.sh dist/AhB/scripts/
          cp configs/opencode2api.json dist/AhB/data/opencode/config.json
          cp configs/freebuff2api.json dist/AhB/data/freebuff/config.json
          chmod +x dist/AhB/bin/* dist/AhB/scripts/*.sh
          tar -C dist -czf AhB_android_arm64.tar.gz AhB
          sha256sum AhB_android_arm64.tar.gz > AhB_android_arm64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AhB-android-arm64
          path: |
            AhB_android_arm64.tar.gz
            AhB_android_arm64.tar.gz.sha256

      - name: Publish dev-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view dev-latest >/dev/null 2>&1; then
            gh release delete dev-latest --yes --cleanup-tag
          fi
          gh release create dev-latest             AhB_android_arm64.tar.gz             AhB_android_arm64.tar.gz.sha256             --target "$GITHUB_SHA"             --title "AhB Android ARM64 dev-latest"             --notes "Automated Android/Termux ARM64 bundle. Includes hubd, opencode2api, Freebuff2API and optional Agent2API binaries."             --prerelease
