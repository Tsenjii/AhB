name: Infrlo Build-Run Command Smoke
on:
  push:
    paths:
      - 'deploy/infrlo/install-command.py'
      - 'deploy/infrlo/run-command.py'
      - 'deploy/infrlo/test-command.py'
      - '.github/workflows/infrlo-command.yml'
  pull_request:
    paths:
      - 'deploy/infrlo/install-command.py'
      - 'deploy/infrlo/run-command.py'
      - 'deploy/infrlo/test-command.py'
      - '.github/workflows/infrlo-command.yml'
jobs:
  test-source-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test Python-only authenticated gateway
        run: |
          python3 -m py_compile deploy/infrlo/install-command.py deploy/infrlo/run-command.py deploy/infrlo/test-command.py
          python3 deploy/infrlo/test-command.py
      - name: Test actual editable Build Command against published Linux release
        run: python3 deploy/infrlo/install-command.py
      - name: Smoke-test real native Hub using editable Run Command
        run: |
          set -euo pipefail
          export AHB_PUBLIC_TOKEN='CI-ONLY-Python-runner-test-secret-1234567890abcdef'
          PORT=18183 python3 deploy/infrlo/run-command.py > /tmp/ahb-infrlo-source.log 2>&1 &
          pid=$!
          trap 'kill -TERM "$pid" 2>/dev/null || :; wait "$pid" 2>/dev/null || :; tail -n 30 /tmp/ahb-infrlo-source.log' EXIT
          ready=0
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18183/healthz | python3 -c 'import json,sys;assert json.load(sys.stdin)["status"]=="ok"' 2>/dev/null; then
              ready=1; break
            fi
            sleep 1
          done
          [ "$ready" = 1 ] || { echo 'Infrlo Python runner could not start Hub'; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18183/v1/models)" = 401 ]
          curl -fsS -H "Authorization: Bearer $AHB_PUBLIC_TOKEN" \
            http://127.0.0.1:18183/api/providers | python3 -c '
          import json,sys
          providers=json.load(sys.stdin)["providers"]
          assert len(providers)==9
          assert {p["id"] for p in providers if p["enabled"]}=={"opencode"}
          '
          curl -fsS -H "Authorization: Bearer $AHB_PUBLIC_TOKEN" \
            http://127.0.0.1:18183/v1/models | python3 -c '
          import json,sys
          assert json.load(sys.stdin)["object"]=="list"
          '
          echo 'Infrlo editable build/run Python-mode native smoke passed'
