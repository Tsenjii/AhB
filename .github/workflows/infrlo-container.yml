name: Infrlo Container Smoke
on:
  push:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/infrlo/**'
      - '.github/workflows/infrlo-container.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/infrlo/**'
      - '.github/workflows/infrlo-container.yml'
jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify authenticated gateway and startup script
        run: |
          node --check deploy/infrlo/auth-gateway.mjs
          bash -n deploy/infrlo/entrypoint.sh
          node --test deploy/infrlo/test-auth.mjs
      - name: Build pinned Linux image
        run: docker build -t ahb-infrlo:ci -f Dockerfile .
      - name: Smoke startup under 512 MiB RAM cap
        run: |
          set -euo pipefail
          docker run -d --name ahb-infrlo-ci --memory 512m \
            -e AHB_PUBLIC_TOKEN='CI-ONLY-test-token-not-a-real-secret-1234567890abcdef' \
            -p 127.0.0.1:18080:8080 ahb-infrlo:ci
          trap 'docker logs ahb-infrlo-ci || :; docker rm -f ahb-infrlo-ci || :' EXIT
          ready=0
          for _ in $(seq 1 45); do
            if curl -fsS --max-time 2 http://127.0.0.1:18080/healthz | jq -e '.status=="ok"' >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" = 1 ] || { echo 'Native Linux Hub did not start'; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/v1/models)" = 401 ]
          curl -fsS -H 'Authorization: Bearer CI-ONLY-test-token-not-a-real-secret-1234567890abcdef' \
            http://127.0.0.1:18080/v1/models | jq -e '.object=="list"' >/dev/null
          curl -fsS -H 'Authorization: Bearer CI-ONLY-test-token-not-a-real-secret-1234567890abcdef' \
            http://127.0.0.1:18080/api/providers | jq -e '(.providers|length)==9' >/dev/null
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Authorization: Bearer CI-ONLY-test-token-not-a-real-secret-1234567890abcdef' \
            http://127.0.0.1:18080/api/control/wake/opencode)" = 403 ]
          [ "$(docker inspect -f '{{.State.OOMKilled}}' ahb-infrlo-ci)" = false ]
          echo 'Infrlo native Linux 512 MiB cold-start/auth smoke passed'
