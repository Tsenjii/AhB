name: Build Android ARM64 bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "go.mod"
      - "cmd/**"
      - "internal/**"
      - "config.example.json"
      - "configs/**"
      - "scripts/**"
      - ".github/workflows/build-android-arm64.yml"

permissions:
  contents: write

concurrency:
  group: ahb-android-prebuilt
  cancel-in-progress: true

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: aarch64-linux-android

      - name: Locate Android NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            ndk="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          test -d "$ndk"
          toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$toolchain/aarch64-linux-android24-clang"
          echo "ANDROID_NDK_SELECTED=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Build hubd for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/AhB/bin
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o dist/AhB/bin/hubd ./cmd/hubd

      - name: Build pinned OpenCode gateway for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.3.7 https://github.com/jasonxu114514/opencode2api.git /tmp/opencode2api
          cd /tmp/opencode2api
          CC="$ANDROID_TOOLCHAIN/aarch64-linux-android24-clang" \
            GOOS=android GOARCH=arm64 CGO_ENABLED=1 \
            go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/dist/AhB/bin/opencode2api" ./cmd/opencode2api

      - name: Build pinned FreeBuff gateway for Android ARM64
        shell: bash
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_TOOLCHAIN }}/aarch64-linux-android24-clang
          CC_aarch64_linux_android: ${{ env.ANDROID_TOOLCHAIN }}/aarch64-linux-android24-clang
          AR_aarch64_linux_android: ${{ env.ANDROID_TOOLCHAIN }}/llvm-ar
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.10.3 https://github.com/lza6/Freebuff-2API.git /tmp/freebuff2api
          cd /tmp/freebuff2api
          cargo build --locked --release --target aarch64-linux-android
          cp target/aarch64-linux-android/release/freebuff2api "$GITHUB_WORKSPACE/dist/AhB/bin/freebuff2api"
          cp LICENSE "$GITHUB_WORKSPACE/dist/AhB/LICENSE.freebuff2api" || true

      - name: Build pinned Agent2API headless for Android ARM64
        shell: bash
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_TOOLCHAIN }}/aarch64-linux-android24-clang
          CC_aarch64_linux_android: ${{ env.ANDROID_TOOLCHAIN }}/aarch64-linux-android24-clang
          AR_aarch64_linux_android: ${{ env.ANDROID_TOOLCHAIN }}/llvm-ar
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.9.6 https://github.com/aimod-cc/agent2api.git /tmp/agent2api
          cd /tmp/agent2api/desktop-tauri/src-tauri
          cargo build --locked --release --target aarch64-linux-android \
            --package agent2api-server --bin agent2api-server
          cp ../../target/aarch64-linux-android/release/agent2api-server \
            "$GITHUB_WORKSPACE/dist/AhB/bin/agent2api-server"
          mkdir -p "$GITHUB_WORKSPACE/dist/AhB/data/agent2api"
          cp -R ../ui "$GITHUB_WORKSPACE/dist/AhB/data/agent2api/ui"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Build optional lightweight GitHub Copilot bridge for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          COPILOT_SHA="a4aac95d4a8f430f02121f79ea36aeaaa06daea1"
          rm -rf /tmp/copilot2api
          git init /tmp/copilot2api
          git -C /tmp/copilot2api remote add origin https://github.com/whtsky/copilot2api.git
          git -C /tmp/copilot2api fetch --depth 1 origin "$COPILOT_SHA"
          git -C /tmp/copilot2api checkout --detach FETCH_HEAD
          cd /tmp/copilot2api
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/dist/AhB/bin/copilot2api" .
          cp LICENSE "$GITHUB_WORKSPACE/dist/AhB/LICENSE.copilot2api"

      - name: Build pinned Grok2API for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          GROK_SHA="7c889a960e2638341b4dae9a5c81af0e0f38c87f"
          rm -rf /tmp/grok2api
          git init /tmp/grok2api
          git -C /tmp/grok2api remote add origin https://github.com/chenyme/grok2api.git
          git -C /tmp/grok2api fetch --depth 1 origin "$GROK_SHA"
          git -C /tmp/grok2api checkout --detach FETCH_HEAD

          cd /tmp/grok2api
          corepack enable
          corepack prepare pnpm@11.5.2 --activate
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

          cd backend
          CC="$ANDROID_TOOLCHAIN/aarch64-linux-android24-clang" \
            GOOS=android GOARCH=arm64 CGO_ENABLED=1 \
            go build -buildvcs=false -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/dist/AhB/bin/grok2api" ./cmd/grok2api

          mkdir -p "$GITHUB_WORKSPACE/dist/AhB/data/grok2api/frontend"
          cp -R /tmp/grok2api/frontend/dist "$GITHUB_WORKSPACE/dist/AhB/data/grok2api/frontend/dist"
          cp /tmp/grok2api/LICENSE "$GITHUB_WORKSPACE/dist/AhB/LICENSE.grok2api" || true

      - name: Build pinned Kiro-Go for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          KIRO_SHA="f8f6071c9298a4266ad3e0c7e483d4a2510cbcaf"
          rm -rf /tmp/kiro-go
          git init /tmp/kiro-go
          git -C /tmp/kiro-go remote add origin https://github.com/Quorinex/Kiro-Go.git
          git -C /tmp/kiro-go fetch --depth 1 origin "$KIRO_SHA"
          git -C /tmp/kiro-go checkout --detach FETCH_HEAD

          cd /tmp/kiro-go
          CC="$ANDROID_TOOLCHAIN/aarch64-linux-android24-clang" \
            GOOS=android GOARCH=arm64 CGO_ENABLED=1 \
            go build -buildvcs=false -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/dist/AhB/bin/kiro-go" .

          mkdir -p "$GITHUB_WORKSPACE/dist/AhB/data/kiro-go"
          cp -R /tmp/kiro-go/web "$GITHUB_WORKSPACE/dist/AhB/data/kiro-go/web"
          cp /tmp/kiro-go/LICENSE "$GITHUB_WORKSPACE/dist/AhB/LICENSE.kiro-go" || true

      - name: Build pinned DeepSeek2API for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          DS_SHA="7a0925fa9bd83e36838b4d3762c81292feb344c2"
          rm -rf /tmp/deepseek2api
          git init /tmp/deepseek2api
          git -C /tmp/deepseek2api remote add origin https://github.com/zengtao227/Deepseek2API.git
          git -C /tmp/deepseek2api fetch --depth 1 origin "$DS_SHA"
          git -C /tmp/deepseek2api checkout --detach FETCH_HEAD

          cd /tmp/deepseek2api
          python3 - <<'PY'
          from pathlib import Path
          p = Path("cmd/Deepseek2API/main.go")
          s = p.read_text()
          old = 'Addr:              "0.0.0.0:" + port,'
          new = 'Addr:              "127.0.0.1:" + port,'
          if old not in s:
              raise SystemExit("expected Deepseek2API listen address not found")
          p.write_text(s.replace(old, new, 1))
          PY

          npm ci --prefix webui
          npm run build --prefix webui

          CC="$ANDROID_TOOLCHAIN/aarch64-linux-android24-clang" \
            GOOS=android GOARCH=arm64 CGO_ENABLED=1 \
            go build -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/dist/AhB/bin/deepseek2api" ./cmd/Deepseek2API

          mkdir -p "$GITHUB_WORKSPACE/dist/AhB/data/deepseek2api/static"
          cp -R static/admin "$GITHUB_WORKSPACE/dist/AhB/data/deepseek2api/static/admin"
          cp LICENSE "$GITHUB_WORKSPACE/dist/AhB/LICENSE.deepseek2api" || true

      - name: Assemble Termux bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/AhB/configs dist/AhB/scripts dist/AhB/data/opencode dist/AhB/data/freebuff dist/AhB/data/deepseek2api dist/AhB/data/grok2api/frontend dist/AhB/data/kiro-go dist/AhB/logs
          cp config.example.json dist/AhB/
          cp configs/opencode2api.json configs/freebuff2api.json configs/deepseek2api.json configs/grok2api.yaml configs/kiro-go.json dist/AhB/configs/
          cp scripts/prepare-configs.sh scripts/run-termux.sh scripts/start-termux.sh \
             scripts/stop-termux.sh scripts/doctor-termux.sh scripts/smoke.sh \
             scripts/test-chat.sh scripts/test-tool-roundtrip.sh scripts/upgrade-prebuilt-termux.sh scripts/connect-bridge.sh scripts/login-copilot2api.sh scripts/enable-copilot2api.sh scripts/install-kimiweb-termux.sh scripts/enable-kimiweb-termux.sh scripts/enable-agent2api.sh scripts/enable-deepseek2api.sh \
             scripts/enable-grok2api.sh scripts/enable-kiro-go.sh scripts/enable-lmarena-external.sh dist/AhB/scripts/
          cp configs/opencode2api.json dist/AhB/data/opencode/config.json
          cp configs/freebuff2api.json dist/AhB/data/freebuff/config.json
          cp configs/deepseek2api.json dist/AhB/data/deepseek2api/config.json
          cp configs/grok2api.yaml dist/AhB/data/grok2api/config.yaml
          cp configs/kiro-go.json dist/AhB/data/kiro-go/config.json
          chmod 700 dist/AhB/bin/*
          chmod +x dist/AhB/scripts/*.sh
          tar -C dist -czf AhB_android_arm64.tar.gz AhB
          sha256sum AhB_android_arm64.tar.gz > AhB_android_arm64.tar.gz.sha256
          sha256sum dist/AhB/bin/* > AhB_android_arm64_binaries.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AhB-android-arm64
          retention-days: 14
          path: |
            AhB_android_arm64.tar.gz
            AhB_android_arm64.tar.gz.sha256
            AhB_android_arm64_binaries.sha256

      - name: Publish public prebuilt branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ahb-prebuilt
          cp AhB_android_arm64.tar.gz /tmp/ahb-prebuilt/
          cp AhB_android_arm64.tar.gz.sha256 /tmp/ahb-prebuilt/
          cp AhB_android_arm64_binaries.sha256 /tmp/ahb-prebuilt/
          printf '%s\n' "$GITHUB_SHA" > /tmp/ahb-prebuilt/source-commit.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan prebuilt-publish
          git rm -rf .
          cp /tmp/ahb-prebuilt/* .
          git add AhB_android_arm64.tar.gz AhB_android_arm64.tar.gz.sha256 AhB_android_arm64_binaries.sha256 source-commit.txt
          git commit -m "prebuilt: Android ARM64 $GITHUB_SHA"
          git push --force origin HEAD:prebuilt