name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
      - name: Validate Termux scripts
        run: bash -n scripts/*.sh

      - name: Verify AhB stop helper isolates Node and Python services
        run: bash scripts/test-stop-termux.sh

      - name: Test safe and idempotent config migration
        run: bash scripts/test-prepare-configs.sh

      - name: Validate full Chat Completions SSE framing
        run: bash scripts/test-stream-fixture.sh

      - name: Verify metadata-only provider inventory
        run: bash scripts/test-provider-status-fixture.sh

      - name: Verify FreeBuff onboarding never exposes credentials
        run: bash scripts/test-freebuff-login-fixture.sh

      - name: Test actual model chat smoke (HTTP 200 is not enough)
        run: bash scripts/test-chat-fixture.sh

      - name: Test Termux doctor execution and private bridges
        run: bash scripts/test-doctor-termux.sh

      - name: Test non-destructive prebuilt upgrades
        run: bash scripts/test-upgrade-prebuilt.sh
      - name: Test universal localhost bridge connector
        run: bash scripts/test-connect-bridge.sh
      - name: Validate embedded dashboard script
        run: bash scripts/test-dashboard.sh

      - name: Verify full native tool-call roundtrip
        run: bash scripts/test-tool-roundtrip-fixture.sh

      - name: Verify Grok2API key-preserving enable workflow
        run: bash scripts/test-enable-grok2api-fixture.sh

      - name: Validate Grok2API real inference diagnostic fixture
        run: bash scripts/test-grok2api-fixture.sh

      - name: Validate living provider registry
        run: bash scripts/test-provider-registry.sh

      - name: Validate JSON configs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = [Path("config.example.json"), *sorted(Path("configs").glob("*.json"))]
          for path in paths:
              with path.open("r", encoding="utf-8") as f:
                  json.load(f)
              print("ok", path)
          PY

      - run: go test ./...
      - name: Race-check supervisor and routing
        run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/hubd